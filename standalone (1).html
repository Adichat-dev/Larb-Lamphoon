<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ชุมชนสะอาด</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--g:#245f46;--bg:#f4f7f4;--tx:#1d2b25;--mu:#6b7b73;--bd:#e3e9e5;--card:#fff;--tint:#e9f2ec;--err:#b3392f}
@media (prefers-color-scheme:dark){:root{--bg:#121a16;--tx:#e8efea;--mu:#9bb0a5;--bd:#2a3731;--card:#1a2420;--tint:#203128;--g:#5fb88c}}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6}
header{background:var(--card);border-bottom:1px solid var(--bd)}
.bar{max-width:1100px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{width:36px;height:36px;border-radius:10px;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:700}
.brand b{display:block;line-height:1.2}.brand small{color:var(--mu);font-size:12px}
nav{flex:1;display:flex;gap:20px;justify-content:center}
nav a{color:var(--mu);text-decoration:none;font-size:14px;padding:4px 0}nav a.on{color:var(--g);font-weight:700}
.who{display:flex;gap:10px;align-items:center;font-size:14px}
main{max-width:1100px;margin:auto;padding:28px 20px 40px}
.eyebrow{color:var(--g);font-size:12px}h1{margin:2px 0 4px;font-size:28px}.sub{color:var(--mu);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:24px}
.cols{display:grid;grid-template-columns:2fr 1fr;gap:20px;align-items:start}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tint{background:var(--tint);border-radius:12px;padding:16px;font-size:14px}
label{display:block;font-weight:500;font-size:14px;margin:14px 0 6px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:var(--card);color:var(--tx)}
textarea{min-height:90px;resize:vertical}
.btn{display:inline-flex;gap:8px;justify-content:center;align-items:center;padding:11px 18px;border-radius:8px;border:1px solid var(--g);background:var(--g);color:#fff;font:inherit;font-weight:500;cursor:pointer;text-decoration:none}
.btn.ghost{background:var(--card);color:var(--g)}.btn.full{width:100%;margin-top:18px}.btn:disabled{opacity:.6}
.hint{color:var(--mu);font-size:12px;margin:6px 0}.err{color:var(--err);font-size:13px;margin-top:8px}
.badge{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;white-space:nowrap}
.pend{background:#fbefd9;color:#8a5a12}.prog{background:#e3edf5;color:#2f6078}.done{background:#dff0e6;color:#245f46}
.high{background:#fde8e6;color:var(--err)}.medium,.low{color:var(--mu);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.stats .card{padding:16px}.stats strong{font-size:32px;margin-right:6px}
.row{display:grid;grid-template-columns:90px 1fr auto auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--bd)}
.row .acts{display:flex;gap:8px}
.big{font-size:44px;font-weight:700;color:var(--g);margin:6px 0;text-align:center}
.center{text-align:center;max-width:560px;margin:auto}
.tl{list-style:none;padding:0;margin:0}.tl li{padding:0 0 12px 28px;position:relative;font-size:14px}
.tl li:before{content:"";position:absolute;left:4px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--bd)}
.tl li.ok:before{background:var(--g)}.tl small{display:block;color:var(--mu)}
.photo{width:100%;max-height:340px;object-fit:cover;border-radius:10px;margin-top:12px}
.bar2{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:12px 0}.bar2 i{display:block}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px 8px;border-top:1px solid var(--bd)}th{color:var(--mu);font-weight:500}
.tw{overflow-x:auto}
.auth{max-width:420px;margin:40px auto 60px;padding:0 20px;width:100%}
.auth-page{min-height:100vh}
.auth-top{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;font-size:14px;color:var(--mu)}
.auth-top a{color:var(--g);font-weight:700;text-decoration:none}
.btn.google{width:100%;background:var(--card);color:var(--tx);border-color:var(--bd)}
.or{display:flex;align-items:center;gap:12px;color:var(--mu);font-size:12px;margin:18px 0 2px}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--bd)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:14px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--g);color:#fff;border-color:var(--g)}.seg button:disabled{opacity:.45;cursor:not-allowed}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--mu);font-weight:400;margin-top:16px}.check input{width:auto;margin-top:5px}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--g);outline-offset:1px}
.pw{position:relative}.pw button{position:absolute;right:8px;top:8px;border:0;background:none;cursor:pointer;color:var(--g);font:inherit;font-size:13px;padding:4px 6px}.pw input{padding-right:64px}
.tabs{display:flex;gap:8px;margin:16px 0}.tabs .btn{flex:1}
footer{max-width:1100px;margin:auto;padding:16px 20px 30px;color:var(--mu);font-size:12px;border-top:1px solid var(--bd)}
@media(max-width:760px){.cols,.two{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}nav{order:3;flex-basis:100%;justify-content:flex-start}h1{font-size:23px}.card{padding:18px}}

</style>
</head>
<body>
<div id="root"></div>
<script>
// ================= In-browser backend (replaces server.js) =================
// ข้อมูลทั้งหมดเก็บใน localStorage ของเบราว์เซอร์ (เฉพาะเครื่อง/เบราว์เซอร์นี้) — เหมาะสำหรับสาธิต/ทดลอง
const DB_KEY = 'chumchon-sakaad-db-v1', SESS_KEY = 'chumchon-sakaad-session-v1';
const mem = {};
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch { return mem[k] ?? null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { mem[k] = v; } },
  del(k) { try { localStorage.removeItem(k); } catch { delete mem[k]; } },
};
const nowTs = () => new Date().toISOString().slice(0, 19).replace('T', ' ');
const sha = async s => {
  if (globalThis.crypto?.subtle) {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
  }
  let a = 5381, c = 52711; // fallback (ไม่ปลอดภัยเท่า SHA-256 แต่ใช้ได้เมื่อไม่มี crypto.subtle)
  for (let i = 0; i < s.length; i++) { a = (a * 33) ^ s.charCodeAt(i); c = (c * 31 + s.charCodeAt(i)) | 0; }
  return 'f' + (a >>> 0).toString(16) + (c >>> 0).toString(16);
};
const hashPw = async (pw, salt) => salt + ':' + await sha(salt + ':' + pw);
const newSalt = () => Array.from(crypto.getRandomValues(new Uint8Array(8)), x => x.toString(16).padStart(2, '0')).join('');
const verifyPw = async (pw, stored) => (await hashPw(pw, stored.split(':')[0])) === stored;

async function loadDb() {
  let d; try { d = JSON.parse(ls.get(DB_KEY)); } catch { d = null; }
  if (d && d.users) return d;
  d = { users: [], reports: [], history: [], notifications: [], seq: { u: 0, r: 0, h: 0, n: 0 } };
  for (const [role, email, name] of [['admin', 'admin@example.com', 'ผู้ดูแลระบบ (ทดลอง)'], ['officer', 'officer@example.com', 'เจ้าหน้าที่ (ทดลอง)']])
    d.users.push({ id: ++d.seq.u, name, email, password_hash: await hashPw('demo1234', newSalt()), role });
  saveDb(d); return d;
}
const saveDb = d => ls.set(DB_KEY, JSON.stringify(d));
const code = id => 'WS-' + String(id).padStart(4, '0');
const str = (v, min, max) => typeof v === 'string' && v.trim().length >= min && v.trim().length <= max ? v.trim() : null;
const fail = msg => { throw new Error(msg); };

function currentUser(d) {
  try {
    const s = JSON.parse(ls.get(SESS_KEY));
    if (!s || s.exp < Date.now()) return null;
    const u = d.users.find(x => x.id === s.id);
    return u ? { id: u.id, name: u.name, role: u.role } : null;
  } catch { return null; }
}
const setSession = u => { ls.set(SESS_KEY, JSON.stringify({ id: u.id, exp: Date.now() + 2 * 3600e3 })); return { id: u.id, name: u.name, role: u.role }; };
const need = (d, ...roles) => {
  const u = currentUser(d);
  if (!u) fail('กรุณาเข้าสู่ระบบ');
  if (!roles.includes(u.role)) fail('ไม่มีสิทธิ์');
  return u;
};

// ย่อรูปแล้วเก็บเป็น data URL (localStorage จุได้จำกัด ~5MB)
function readImage(file) {
  return new Promise((resolve, reject) => {
    if (!file || !file.size) return resolve(null);
    if (file.size > 5 * 1024 * 1024 || !/^image\/(jpeg|png|webp)$/.test(file.type)) return reject(new Error('รองรับเฉพาะรูป JPG/PNG/WebP ไม่เกิน 5 MB'));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 800 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('อ่านรูปไม่ได้')); };
    img.src = url;
  });
}
const persist = d => { try { saveDb(d); } catch { fail('พื้นที่จัดเก็บในเบราว์เซอร์เต็ม ลองไม่แนบรูปหรือล้างข้อมูลเก่า'); } };

const routes = {
  async 'GET /me'(d) { return currentUser(d); },
  async 'POST /auth/signup'(d, { json: b }) {
    const name = str(b.name, 2, 80), email = str(b.email, 5, 120)?.toLowerCase(), pw = b.password;
    if (!name || !email || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) fail('ข้อมูลไม่ถูกต้อง');
    if (typeof pw !== 'string' || pw.length < 8 || pw.length > 72 || !/[A-Za-z]/.test(pw) || !/\d/.test(pw)) fail('รหัสผ่านต้องยาว 8+ ตัว มีทั้งตัวอักษรและตัวเลข');
    if (d.users.some(u => u.email === email)) fail('อีเมลนี้ถูกใช้แล้ว');
    const u = { id: ++d.seq.u, name, email, password_hash: await hashPw(pw, newSalt()), role: 'citizen' };
    d.users.push(u); persist(d); return setSession(u);
  },
  async 'POST /auth/login'(d, { json: b }) {
    const email = str(b.email, 3, 120)?.toLowerCase(), u = d.users.find(x => x.email === email);
    if (!u || !(await verifyPw(typeof b.password === 'string' ? b.password : '', u.password_hash))) fail('อีเมลหรือรหัสผ่านไม่ถูกต้อง');
    return setSession(u);
  },
  async 'POST /auth/logout'() { ls.del(SESS_KEY); return { ok: true }; },

  async 'POST /reports'(d, { body: fd }) {
    const me = need(d, 'citizen');
    const type = str(fd.get('waste_type'), 1, 40), desc = str(fd.get('description'), 3, 1000), loc = str(fd.get('location'), 3, 200), urgency = fd.get('urgency');
    if (!type || !desc || !loc || !['low', 'medium', 'high'].includes(urgency)) fail('กรุณากรอกรายละเอียดและตำแหน่งให้ครบ');
    const lat = Number(fd.get('lat')), lng = Number(fd.get('lng')), gps = fd.get('lat') && fd.get('lng') && Math.abs(lat) <= 90 && Math.abs(lng) <= 180;
    const photo = await readImage(fd.get('photo'));
    const r = { id: ++d.seq.r, user_id: me.id, waste_type: type, urgency, description: desc, location: loc, lat: gps ? lat : null, lng: gps ? lng : null, photo, after_photo: null, status: 'Pending', officer_id: null, created_at: nowTs() };
    d.reports.push(r); d.history.push({ id: ++d.seq.h, report_id: r.id, status: 'Pending', changed_by: me.id, changed_at: r.created_at });
    persist(d); return { tracking: code(r.id) };
  },
  async 'GET /my-reports'(d) {
    const me = need(d, 'citizen');
    return d.reports.filter(r => r.user_id === me.id).sort((a, b) => b.id - a.id).slice(0, 100).map(r => ({ id: r.id, waste_type: r.waste_type, urgency: r.urgency, location: r.location, status: r.status, created_at: r.created_at, tracking: code(r.id) }));
  },
  async 'GET /track'(d, { arg }) {
    const m = /^WS-(\d{4,8})$/.exec(String(arg).toUpperCase()), r = m && d.reports.find(x => x.id === Number(m[1]));
    if (!r) fail('ไม่พบหมายเลขติดตามนี้');
    const { id, user_id, officer_id, ...pub } = r;
    return { ...pub, tracking: code(id), history: d.history.filter(h => h.report_id === id).map(h => ({ status: h.status, changed_at: h.changed_at })) };
  },
  async 'GET /notifications'(d) {
    const me = need(d, 'citizen');
    return d.notifications.filter(n => n.user_id === me.id).sort((a, b) => b.id - a.id).slice(0, 50).map(({ id, message, is_read, created_at }) => ({ id, message, is_read, created_at }));
  },
  async 'POST /notifications/read'(d) {
    const me = need(d, 'citizen'); d.notifications.forEach(n => { if (n.user_id === me.id) n.is_read = 1; }); persist(d); return { ok: true };
  },

  async 'GET /jobs'(d) {
    need(d, 'officer', 'admin');
    const rank = { high: 0, medium: 1, low: 2 };
    return d.reports.filter(r => r.status !== 'Collected')
      .sort((a, b) => rank[a.urgency] - rank[b.urgency] || a.created_at.localeCompare(b.created_at) || a.id - b.id)
      .map(r => ({ id: r.id, waste_type: r.waste_type, urgency: r.urgency, description: r.description, location: r.location, lat: r.lat, lng: r.lng, photo: r.photo, status: r.status, created_at: r.created_at, tracking: code(r.id) }));
  },
  async 'POST /jobs/status'(d, { arg, json, body }) {
    const me = need(d, 'officer'), id = Number(arg), r = Number.isInteger(id) && d.reports.find(x => x.id === id);
    if (!r) fail('ไม่พบงาน');
    const next = json ? json.status : body.get('status');
    if ({ 'Pending': 'In progress', 'In progress': 'Collected' }[r.status] !== next) fail('เปลี่ยนสถานะไม่ถูกต้อง');
    const after = body && body.get ? await readImage(body.get('after_photo')) : null;
    r.status = next; r.officer_id = me.id; if (after) r.after_photo = after;
    d.history.push({ id: ++d.seq.h, report_id: id, status: next, changed_by: me.id, changed_at: nowTs() });
    if (r.user_id) d.notifications.push({ id: ++d.seq.n, user_id: r.user_id, message: `รายงาน ${code(id)} เปลี่ยนสถานะเป็น ${next}`, is_read: 0, created_at: nowTs() });
    persist(d); return { tracking: code(id), status: next };
  },

  async 'GET /dashboard'(d) {
    need(d, 'admin');
    const by = {}, loc = {};
    d.reports.forEach(r => { by[r.status] = (by[r.status] || 0) + 1; const k = r.location.trim().toLowerCase(); (loc[k] ||= { location: r.location, c: 0 }).c++; });
    return { total: d.reports.length, byStatus: Object.entries(by).map(([status, c]) => ({ status, c })), repeated: Object.values(loc).filter(x => x.c > 1).sort((a, b) => b.c - a.c) };
  },
  async 'GET /admin/reports'(d) {
    need(d, 'admin');
    return [...d.reports].sort((a, b) => b.id - a.id).slice(0, 500).map(r => ({ id: r.id, location: r.location, waste_type: r.waste_type, urgency: r.urgency, description: r.description, status: r.status, created_at: r.created_at, tracking: code(r.id) }));
  },
};

const api = async (p, { body, json } = {}) => {
  const d = await loadDb(), method = body || json ? 'POST' : 'GET';
  let m;
  const key = (m = /^\/track\/(.+)$/.exec(p)) ? [`${method} /track`, decodeURIComponent(m[1])]
    : (m = /^\/jobs\/(\d+)\/status$/.exec(p)) ? [`${method} /jobs/status`, m[1]] : [`${method} ${p}`, null];
  const fn = routes[key[0]];
  if (!fn) fail('เกิดข้อผิดพลาด');
  return fn(d, { json, body, arg: key[1] });
};

// ส่งออก CSV (ฝั่งผู้ดูแล) — กันสูตร Excel ฉีดคำสั่งด้วยการนำหน้า '
const csvCell = v => { let s = String(v ?? ''); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
async function exportCsv() {
  const rows = await api('/admin/reports');
  const out = ['tracking,area,waste_type,urgency,description,status,reported_at', ...rows.map(r => [r.tracking, r.location, r.waste_type, r.urgency, r.description, r.status, r.created_at].map(csvCell).join(','))];
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + out.join('\r\n')], { type: 'text/csv;charset=utf-8' }));
  a.download = 'reports.csv'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
// ================= end backend =================

// Frontend: all text is inserted with textContent/createTextNode (no innerHTML) to prevent XSS.
const root = document.getElementById('root');
let user = null, last = null;
const ST = { 'Pending': ['รอดำเนินการ', 'pend', 'รับเรื่องแจ้งแล้ว'], 'In progress': ['กำลังดำเนินการ', 'prog', 'เจ้าหน้าที่รับเรื่องแล้ว'], 'Collected': ['เก็บขยะแล้ว', 'done', 'เก็บขยะเรียบร้อย'] };
const UR = { high: 'เร่งด่วนสูง', medium: 'เร่งด่วนปานกลาง', low: 'เร่งด่วนต่ำ' };
const TYPES = ['ขยะทั่วไป', 'ขยะชิ้นใหญ่', 'ขยะอันตราย', 'ขยะรีไซเคิล'];

const h = (t, a = {}, ...c) => {
  const e = document.createElement(t);
  for (const [k, v] of Object.entries(a)) {
    if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  if (t === 'form' && a.onsubmit) { // ทำงานได้แม้พรีวิวบล็อกการส่งฟอร์ม (sandbox ไม่มี allow-forms)
    const run = () => a.onsubmit({ preventDefault() {} });
    e.addEventListener('click', ev => { const b = ev.target.closest && ev.target.closest('button[type=submit]'); if (b && e.contains(b)) { ev.preventDefault(); run(); } });
    e.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.tagName === 'INPUT' && ev.target.type !== 'file') { ev.preventDefault(); run(); } });
  }
  for (const x of c.flat(Infinity)) if (x != null && x !== false) e.append(x.nodeType ? x : document.createTextNode(x));
  return e;
};
const fmt = s => new Date(s.replace(' ', 'T') + 'Z').toLocaleString('th-TH', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) + ' น.';
const badge = s => h('span', { class: 'badge ' + ST[s][1] }, '● ' + ST[s][0]);
const urg = u => h('span', { class: u === 'high' ? 'badge high' : u }, '● ' + UR[u]);
const field = (label, input) => h('div', {}, h('label', {}, label), input);
const sel = (name, opts) => h('select', { name }, opts.map(([v, t]) => h('option', { value: v }, t)));
const go = hash => { location.hash === '#' + hash ? render() : (location.hash = hash); };
const head = (eyebrow, title, sub) => [h('div', { class: 'eyebrow' }, eyebrow), h('h1', {}, title), h('p', { class: 'sub' }, sub)];

// ---------- shell ----------
function shell(route, ...content) {
  const nav = { citizen: [['report', 'แจ้งขยะ'], ['track', 'ติดตามเรื่อง']], officer: [['jobs', 'รายการงาน'], ['track', 'ตรวจสอบเลขติดตาม']], admin: [['dash', 'ภาพรวม'], ['track', 'ตรวจสอบเลขติดตาม']] }[user?.role] || [['track', 'ติดตามเรื่อง']];
  return [

        d.repeated.map(x => h('div', { class: 'row' }, h('b', {}, x.location), h('span'), h('b', {}, x.c + ' เรื่อง'))))),
    h('div', { class: 'card tw' }, h('h3', {}, 'รายงานทั้งหมด'), h('table', {}, h('thead', {}, h('tr', {}, ['หมายเลข', 'พื้นที่', 'ประเภท', 'เร่งด่วน', 'รายละเอียด', 'สถานะ', 'เวลาที่แจ้ง'].map(t => h('th', {}, t)))),
      h('tbody', {}, rows.map(r => h('tr', {}, h('td', {}, h('a', { href: '#track/' + r.tracking }, r.tracking)), h('td', {}, r.location), h('td', {}, r.waste_type), h('td', {}, UR[r.urgency]), h('td', {}, r.description), h('td', {}, badge(r.status)), h('td', {}, fmt(r.created_at)))))))];
}

// ---------- router ----------
async function render() {
  const [route, arg] = location.hash.slice(1).split('/');
  const home = { citizen: 'report', officer: 'jobs', admin: 'dash' }[user?.role];
  const ok = { citizen: ['report', 'done', 'track'], officer: ['jobs', 'job', 'track'], admin: ['dash', 'track'] }[user?.role] || [];
  root.replaceChildren();
  if (!user && route !== 'track') return root.append(authView(route === 'signup' ? 'signup' : 'login'));
  const r = ok.includes(route) || (!user && route === 'track') ? route : home;
  if (r !== route && home) return go(home);
  try {
    const views = { report: reportView, done: doneView, track: () => trackView(arg), jobs: jobsView, job: () => jobView(arg), dash: dashView };
    let c = await views[r]();
    root.append(...shell(r, c));
  } catch (x) { root.append(...shell(r, h('p', { class: 'err' }, x.message))); }
}
window.addEventListener('hashchange', render);
document.addEventListener('click', ev => { // ลิงก์ # ทำงานได้แม้ในหน้าพรีวิวที่ base URL ผิดปกติ
  const a = ev.target.closest && ev.target.closest('a[href^="#"]'); if (!a) return;
  ev.preventDefault(); const t = a.getAttribute('href'); location.hash === t ? render() : (location.hash = t);
});
api('/me').then(u => { user = u; render(); }).catch(render);

</script>
